[project]
name = "photototex"
version = "0.2.0"
description = "Local formula recognition workbench with FastAPI and pretrained pix2tex"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "Pillow>=10.1,<13",
  "matplotlib>=3.6,<4",
  "numpy>=1.26,<3",
  "tqdm>=4.64,<5",
  "PyYAML>=6,<7",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "pix2tex==0.1.4",
  "albumentations==1.3.1",
  "timm==0.5.4",
  "x-transformers==0.15.0",
  "transformers==4.38.2",
  "tokenizers==0.15.2",
]

[project.optional-dependencies]
cpu = ["torch==2.6.0", "torchvision==0.21.0"]
cu124 = ["torch==2.6.0", "torchvision==0.21.0"]

[dependency-groups]
dev = ["pytest>=7,<10", "httpx==0.28.1", "ruff==0.17.2"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu124", extra = "cu124" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu124", extra = "cu124" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
